name: Deploy SwapDeck API

on:
  push:
    branches: [main, claude/simple-app-ideas-1y7kvr]
    paths:
      - "worker/**"
      - ".github/workflows/deploy-worker.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install worker dependencies
        working-directory: worker
        run: npm ci

      # Wrangler tracks which files in worker/migrations/ have already run
      # (in a d1_migrations bookkeeping table), so this only applies new
      # ones — safe to run on every deploy even when nothing changed.
      - name: Apply D1 migrations
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: worker
          command: d1 migrations apply swapdeck --remote --config ./wrangler.toml

      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: worker
          command: deploy --config ./wrangler.toml

      # Browser push (see worker/src/push.js, README "Push notifications")
      # needs its private VAPID key as a Worker secret, never checked into
      # git — only its public half lives in wrangler.toml. Runs on every
      # deploy (idempotent — same value each time) rather than as a one-off
      # manual step, so it survives worker recreation. A plain bash `if`
      # rather than a step-level `if:` conditional referencing `secrets` --
      # a first attempt at that failed the entire workflow before any job
      # even started (confirmed: the run showed the workflow's file path
      # instead of its name and produced zero jobs, GitHub's signature for
      # a workflow that failed schema validation). Skips itself with an
      # ordinary shell check until the one-time repo secret below is added
      # (see README) instead of failing the deploy over a secret that
      # isn't set yet.
      - name: Set VAPID private key secret
        working-directory: worker
        env:
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$VAPID_PRIVATE_KEY" ]; then
            echo "$VAPID_PRIVATE_KEY" | npx wrangler secret put VAPID_PRIVATE_KEY --config ./wrangler.toml
          else
            echo "VAPID_PRIVATE_KEY repo secret not set yet -- skipping (see README 'Push notifications')."
          fi

      # Same idempotent-skip pattern as the VAPID step above, for the same
      # reason: verifyProPurchase (worker/src/routes/purchases.js) needs
      # this to check a purchase against RevenueCat's own server before
      # ever granting Pro -- see README "In-app purchases".
      - name: Set RevenueCat secret key
        working-directory: worker
        env:
          REVENUECAT_SECRET_KEY: ${{ secrets.REVENUECAT_SECRET_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$REVENUECAT_SECRET_KEY" ]; then
            echo "$REVENUECAT_SECRET_KEY" | npx wrangler secret put REVENUECAT_SECRET_KEY --config ./wrangler.toml
          else
            echo "REVENUECAT_SECRET_KEY repo secret not set yet -- skipping (see README 'In-app purchases')."
          fi
