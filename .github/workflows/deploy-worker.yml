name: Deploy SwapDeck API

on:
  push:
    branches: [main, claude/simple-app-ideas-1y7kvr]
    paths:
      - "worker/**"
      - ".github/workflows/deploy-worker.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install worker dependencies
        working-directory: worker
        run: npm ci

      # Wrangler tracks which files in worker/migrations/ have already run
      # (in a d1_migrations bookkeeping table), so this only applies new
      # ones — safe to run on every deploy even when nothing changed.
      - name: Apply D1 migrations
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: worker
          command: d1 migrations apply swapdeck --remote --config ./wrangler.toml

      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: worker
          command: deploy --config ./wrangler.toml

      # Browser push (see worker/src/push.js, README "Push notifications")
      # needs its private VAPID key as a Worker secret, never checked into
      # git — only its public half lives in wrangler.toml. Runs on every
      # deploy (idempotent — same value each time) rather than as a one-off
      # manual step, so it survives worker recreation. Skipped entirely
      # until the one-time repo secret below is added — see README — rather
      # than failing the whole deploy over a secret that isn't set yet.
      - name: Set VAPID private key secret
        if: ${{ secrets.VAPID_PRIVATE_KEY != '' }}
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: worker
          secrets: |
            VAPID_PRIVATE_KEY
        env:
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
