name: Deploy SwapDeck API

on:
  push:
    branches: [main, claude/simple-app-ideas-1y7kvr]
    paths:
      - "worker/**"
      - ".github/workflows/deploy-worker.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install worker dependencies
        working-directory: worker
        run: npm ci

      # Temporary diagnostic: confirms the secrets actually reach this job
      # and reports their length (never their value) to rule out an empty
      # or malformed secret vs. a genuinely invalid/revoked token. Remove
      # once the real deploy succeeds.
      - name: Check secrets are present
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          echo "CLOUDFLARE_API_TOKEN length: ${#TOKEN}"
          echo "CLOUDFLARE_ACCOUNT_ID length: ${#ACCOUNT_ID}"
          if [ -z "$TOKEN" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN is empty or not set as a repository secret"
            exit 1
          fi

      # Idempotent (schema.sql uses CREATE TABLE/INDEX IF NOT EXISTS), so
      # running it on every deploy is safe even when nothing changed.
      - name: Apply D1 schema
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: worker
          command: d1 execute swapdeck --remote --file=./schema.sql

      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: worker
          command: deploy
