name = "swapdeck-api"
main = "src/index.js"
compatibility_date = "2024-09-01"

[[d1_databases]]
binding = "DB"
database_name = "swapdeck"
database_id = "30d86cca-a44d-4300-84e1-2bf9f7dfdc12"
migrations_dir = "migrations"

# Card verification photos (see migrations/0008_card_photos.sql). KV rather
# than R2 -- R2 needs a one-time opt-in from the Cloudflare Dashboard that
# nothing here can do via API, while KV worked out of the box. Values are
# resized client-side to a few hundred KB before upload, well inside KV's
# per-value limit, so there's no real downside at this app's scale.
[[kv_namespaces]]
binding = "PHOTOS"
id = "1da319054a174eff885a7f73a4a6175e"

[vars]
# Comma-separated usernames with access to the Admin tab (list/delete any
# account). Not a secret — this is a plain wrangler.toml var, checked into
# git, not a runtime-settable value — so changing it always goes through a
# real code review + deploy, never a silent database write. See
# worker/src/admin.js.
ADMIN_USERNAMES = "cwinchester636"

# Browser push (see worker/src/push.js). The public key is, by definition,
# public — it's handed to every subscribing browser (VITE_VAPID_PUBLIC_KEY
# in .env must be this same value). VAPID_SUBJECT just identifies this app
# to push services per RFC 8292, any https URL or mailto: works. The
# matching VAPID_PRIVATE_KEY is a Worker secret (`wrangler secret put`),
# never checked into git — see README "Push notifications".
VAPID_PUBLIC_KEY = "BLw28wJ4CUrHRBlSUzP14zNOrpWO6YCp38c3gJySxD1XppklHWqNeeWDWe36QvpHmkmmd3wDvbpjqIai7qofLZ0"
VAPID_SUBJECT = "https://swapdeck.cards"
